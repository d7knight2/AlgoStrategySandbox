name: Frontend Tests

on:
  pull_request:
    branches: ['*']
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Generate coverage report
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  ui-tests:
    name: Run UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:ui

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  snapshot-tests:
    name: Run Snapshot Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Install fonts for consistent visual snapshots
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-color-emoji fonts-liberation

      - name: Run Jest snapshot tests
        run: npm run test:snapshot:jest

      - name: Run Playwright visual snapshot tests
        run: npm run test:snapshot:ui

      - name: Upload snapshot diff artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snapshot-diffs
          path: |
            e2e/snapshots.spec.ts-snapshots/
            test-results/
          retention-days: 14
