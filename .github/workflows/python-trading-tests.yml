name: Python Trading Core Tests

on:
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-trading-tests.yml"
  push:
    branches: ["main"]
    paths:
      - "python/**"
      - ".github/workflows/python-trading-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pytest (Python trading core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx

      - name: Run unit + dashboard UI tests
        env:
          TRADING_MODE: paper
          # Dummy keys so modules that construct clients in import paths don't explode;
          # tests that hit live Alpaca will still fail closed if they run without mocks.
          ALPACA_API_KEY: test-key-not-real
          ALPACA_SECRET_KEY: test-secret-not-real
        run: |
          pytest -v --tb=short \
            tests/test_config.py \
            tests/test_health.py \
            tests/test_risk.py \
            tests/test_scorer.py \
            tests/test_backtest.py \
            tests/test_dashboard_ui.py \
            -m "not ui"

      - name: Ensure dashboard template present
        run: test -f src/monitoring/templates/dashboard.html
