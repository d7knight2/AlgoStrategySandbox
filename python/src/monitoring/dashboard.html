<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Trading Core" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f1115" />
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="apple-touch-icon" href="/static/icon-180.png" />
  <title>Trading Core</title>
  <style>
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      color: #e8e8e8;
      background: #0f1115;
      --card: #1a1d24;
      --border: #2a2f3a;
      --muted: #9aa0a6;
      --ok: #3dd68c;
      --warn: #f5a524;
      --bad: #f31260;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: max(1rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
      max-width: 720px;
      margin-inline: auto;
      -webkit-tap-highlight-color: transparent;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.15rem; font-weight: 650; }
    .sub { color: var(--muted); font-size: 0.8rem; margin-bottom: 1.25rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.9rem 1rem;
    }
    .card.wide { grid-column: 1 / -1; }
    .card h2 {
      font-size: 0.7rem;
      color: var(--muted);
      margin: 0 0 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    .val { font-size: 1.35rem; font-weight: 650; letter-spacing: -0.02em; }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 1rem 0; }
    button {
      background: #2a2f3a;
      color: #e8e8e8;
      border: 1px solid #3a4050;
      border-radius: 12px;
      padding: 0.65rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-appearance: none;
    }
    button.danger { background: #3a1520; border-color: var(--bad); color: var(--bad); }
    button.primary { background: #1c3a2a; border-color: var(--ok); color: var(--ok); }
    button:active { transform: scale(0.98); }
    pre {
      background: #12151a;
      border-radius: 10px;
      padding: 0.75rem;
      overflow: auto;
      font-size: 0.72rem;
      max-height: 220px;
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .toast {
      position: fixed; bottom: max(1rem, env(safe-area-inset-bottom)); left: 50%;
      transform: translateX(-50%);
      background: #2a2f3a; padding: 0.6rem 1rem; border-radius: 20px;
      font-size: 0.85rem; opacity: 0; transition: opacity 0.2s; pointer-events: none;
      z-index: 50;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <h1>Trading Core</h1>
  <p class="sub">Paper · Risk-gated · <span id="ts">—</span></p>

  <div class="grid">
    <div class="card"><h2>Mode</h2><div class="val" id="mode">—</div></div>
    <div class="card"><h2>Risk</h2><div class="val" id="risk">—</div></div>
    <div class="card"><h2>Equity</h2><div class="val" id="equity">—</div></div>
    <div class="card"><h2>Cash</h2><div class="val" id="cash">—</div></div>
    <div class="card"><h2>Buying power</h2><div class="val" id="bp">—</div></div>
    <div class="card"><h2>Market</h2><div class="val" id="mkt">—</div></div>
  </div>

  <div class="actions">
    <button class="primary" onclick="refresh()">Refresh</button>
    <button class="danger" onclick="pause()">STOP</button>
    <button onclick="resume()">Resume</button>
    <button onclick="runReport()">Send report</button>
  </div>

  <div class="grid">
    <div class="card wide"><h2>Positions</h2><pre id="positions">…</pre></div>
    <div class="card wide"><h2>Latest report</h2><pre id="report">Tap “Send report” or wait for scheduled job</pre></div>
    <div class="card wide"><h2>Health</h2><pre id="health">…</pre></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }
    async function j(path, opts) {
      const r = await fetch(path, opts);
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    }
    function money(n) {
      return n == null ? '—' : '$' + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    async function refresh() {
      document.getElementById('ts').textContent = new Date().toLocaleString();
      try {
        const [health, account, positions, risk, market] = await Promise.all([
          j('/health'), j('/account'), j('/positions'), j('/risk/status'), j('/market/status')
        ]);
        document.getElementById('mode').textContent = health.trading_mode || '—';
        document.getElementById('mode').className = 'val ' + (health.trading_mode === 'paper' ? 'ok' : 'bad');
        document.getElementById('equity').textContent = money(account.equity);
        document.getElementById('cash').textContent = money(account.cash);
        document.getElementById('bp').textContent = money(account.buying_power);
        document.getElementById('mkt').textContent = market.is_open ? 'OPEN' : 'CLOSED';
        document.getElementById('mkt').className = 'val ' + (market.is_open ? 'ok' : 'warn');
        const paused = risk.trading_paused;
        document.getElementById('risk').textContent = paused ? 'PAUSED' : 'ACTIVE';
        document.getElementById('risk').className = 'val ' + (paused ? 'bad' : 'ok');
        document.getElementById('positions').textContent = positions.length
          ? positions.map(p => `${p.symbol}  qty=${p.qty}  P/L=${Number(p.unrealized_pl).toFixed(2)}`).join('\n')
          : '(none)';
        document.getElementById('health').textContent = JSON.stringify({ health, risk }, null, 2);
        try {
          const rep = await j('/reports/latest');
          if (rep && !rep.error) document.getElementById('report').textContent = rep.summary || JSON.stringify(rep, null, 2);
        } catch (_) {}
      } catch (e) {
        document.getElementById('health').textContent = 'Error: ' + e.message;
        toast('Refresh failed');
      }
    }
    async function pause() { await j('/risk/pause', { method: 'POST' }); toast('Trading paused'); refresh(); }
    async function resume() { await j('/risk/resume', { method: 'POST' }); toast('Trading resumed'); refresh(); }
    async function runReport() {
      toast('Building report…');
      try {
        const r = await j('/reports/generate', { method: 'POST' });
        document.getElementById('report').textContent = r.summary || JSON.stringify(r, null, 2);
        toast(r.email_sent ? 'Report emailed' : 'Report saved');
      } catch (e) { toast('Report failed'); }
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js').catch(() => {});
    }
    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
